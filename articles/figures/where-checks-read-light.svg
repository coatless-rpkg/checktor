<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img" aria-label="Four folders of a package in a row: R/ for package code, man/ for help page examples, vignettes/ and demo/. One green line spans all four and reads checktor reads all four. Under each folder is a finding checktor catches there: sets a seed inside a function, installs a package, writes outside tempdir(), and changes options() for good.">
  <style>
    svg{--ink:#0E2A47;--muted:#5F7189;--panel:#F1F5F8;--line:#D6DFE8;--sheet:#FFFFFF;--green:#17915B;--greenfill:#2FBF71;--amber:#A86F06;--amberfill:#E7B24B;--cream:#FBF1DD;--chip:#0E2A47;--chiptext:#FFFFFF;--onamber:#0E2A47;--tile:#0E2A47;--tiletext:#F4F7FA;--prompt:#7FD8A6;--check:#FFFFFF;--tint:#E9F6EE}
    text{fill:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif;font-size:16px}
    .m{fill:var(--muted)} .c{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .b{font-weight:600} .pre{white-space:pre}
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--ink)"/>
    </marker>
  </defs>
  <g transform="translate(0,-38)">
  <text x="40" y="74" class="b" style="fill:var(--green)">checktor reads all four</text>
  <line x1="42" y1="88" x2="758" y2="88" stroke="var(--greenfill)" stroke-width="5" stroke-linecap="round"/>
  <rect x="40" y="112" width="165" height="112" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="58" y="150" class="c b" style="font-size:22px">{ }</text>
  <text x="60" y="190" class="c b" style="font-size:17px">R/</text>
  <text x="60" y="211" class="m" style="font-size:14px">Package code</text>
  <circle cx="46" cy="254" r="4.5" fill="var(--amberfill)"/>
  <text x="58" y="259" style="font-size:15px">Sets a seed</text>
  <text x="58" y="280" style="font-size:15px">inside a function</text>
  <rect x="225" y="112" width="165" height="112" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="245" y="128" width="22" height="28" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <line x1="250" y1="136" x2="262" y2="136" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="142" x2="262" y2="142" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="148" x2="258" y2="148" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
  <text x="245" y="190" class="c b" style="font-size:17px">man/</text>
  <text x="245" y="211" class="m" style="font-size:14px">Help page examples</text>
  <circle cx="231" cy="254" r="4.5" fill="var(--amberfill)"/>
  <text x="243" y="259" style="font-size:15px">Installs a package</text>
  <rect x="410" y="112" width="165" height="112" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M430,132 C436,129 441,129 445,132 C449,129 454,129 460,132 V155 C454,152 449,152 445,155 C441,152 436,152 430,155 Z" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="445" y1="132" x2="445" y2="155" stroke="var(--ink)" stroke-width="2"/>
  <text x="430" y="190" class="c b" style="font-size:17px">vignettes/</text>
  <text x="430" y="211" class="m" style="font-size:14px">Long-form guides</text>
  <circle cx="416" cy="254" r="4.5" fill="var(--amberfill)"/>
  <text x="428" y="259" style="font-size:15px">Writes outside</text>
  <text x="428" y="280" style="font-size:15px"><tspan class="c" style="font-size:14px">tempdir()</tspan></text>
  <rect x="595" y="112" width="165" height="112" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="629" cy="142" r="13" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <path d="M625,135.5 L635,142 L625,148.5 Z" fill="var(--ink)"/>
  <text x="615" y="190" class="c b" style="font-size:17px">demo/</text>
  <text x="615" y="211" class="m" style="font-size:14px">Demo scripts</text>
  <circle cx="601" cy="254" r="4.5" fill="var(--amberfill)"/>
  <text x="613" y="259" style="font-size:15px">Changes <tspan class="c" style="font-size:14px">options()</tspan></text>
  <text x="613" y="280" style="font-size:15px">for good</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="The DESCRIPTION of mypkg with three Config/checktor lines highlighted, and a note that reads Applies wherever the package is checked. Config/checktor/disable: news_file leaves a check out, so news_file never runs. Config/checktor/allow: license_file_unneeded mutes a reviewed finding, and the run reports it as muted. Config/checktor/software_names: DuckDB adds a software name, so DuckDB should be in single quotes.">
  <style>
    svg{--ink:#DEE2E6;--muted:#ADB5BD;--panel:#2B3035;--line:#3A4148;--sheet:#1B1F23;--green:#35C07F;--greenfill:#2FBF71;--amber:#E6B34D;--amberfill:#E7B24B;--cream:#3A3320;--chip:#DEE2E6;--chiptext:#1B1F23;--onamber:#0E2A47;--tile:#343A40;--tiletext:#F8F9FA;--prompt:#7FD8A6;--check:#1B1F23;--tint:#1F3A2B}
    text{fill:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif;font-size:16px}
    .m{fill:var(--muted)} .c{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .b{font-weight:600} .pre{white-space:pre}
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--ink)"/>
    </marker>
  </defs>
  <rect x="40.5" y="24.5" width="420" height="270" rx="14" fill="var(--sheet)" stroke="var(--line)"/>
  <text x="60" y="50" class="c b" style="font-size:14px">DESCRIPTION</text>
  <line x1="41" y1="64" x2="460" y2="64" stroke="var(--line)"/>
  <text x="60" y="90" class="c m" style="font-size:13px">Package: mypkg</text>
  <text x="60" y="111" class="c m" style="font-size:13px">License: GPL (&gt;= 3) + file LICENSE</text>
  <text x="500" y="50" class="m" style="font-size:14px">Applies wherever the package is checked</text>
  <rect x="41" y="130" width="419" height="32" fill="var(--tint)"/>
  <rect x="41" y="130" width="3" height="32" fill="var(--greenfill)"/>
  <text x="60" y="150" class="c" style="font-size:13px">Config/checktor/disable: news_file</text>
  <line x1="462" y1="146" x2="490" y2="146" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="508" cy="146" r="14" fill="none" stroke="var(--green)" stroke-width="2"/>
  <line x1="502" y1="152" x2="514" y2="140" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="534" y="142" class="b">Leaves a check out</text>
  <text x="534" y="163" class="m" style="font-size:14px"><tspan class="c" style="font-size:13.5px">news_file</tspan> never runs</text>
  <rect x="41" y="186" width="419" height="32" fill="var(--tint)"/>
  <rect x="41" y="186" width="3" height="32" fill="var(--greenfill)"/>
  <text x="60" y="206" class="c" style="font-size:13px">Config/checktor/allow: license_file_unneeded</text>
  <line x1="462" y1="202" x2="490" y2="202" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="508" cy="202" r="14" fill="none" stroke="var(--green)" stroke-width="2"/>
  <polyline points="502,202 506,206.5 514,197" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="534" y="198" class="b">Mutes a reviewed finding</text>
  <text x="534" y="219" class="m" style="font-size:14px">The run reports it as muted</text>
  <rect x="41" y="242" width="419" height="32" fill="var(--tint)"/>
  <rect x="41" y="242" width="3" height="32" fill="var(--greenfill)"/>
  <text x="60" y="262" class="c" style="font-size:13px">Config/checktor/software_names: DuckDB</text>
  <line x1="462" y1="258" x2="490" y2="258" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="508" cy="258" r="14" fill="none" stroke="var(--green)" stroke-width="2"/>
  <path d="M502,258 H514 M508,252 V264" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="534" y="254" class="b">Adds a software name</text>
  <text x="534" y="275" class="m" style="font-size:14px">DuckDB should be in single quotes</text>
</svg>

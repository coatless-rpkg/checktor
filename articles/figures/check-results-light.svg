<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-label="Three check results. Passed, a green check mark, means it ran and found nothing, as print_cat_usage did. Failed, an amber cross, means it ran and found something to fix, as tf_usage did. Skipped, a dashed empty ring, means it could not run, as url_liveness did, and it never counts as a pass.">
  <style>
    svg{--ink:#0E2A47;--muted:#5F7189;--panel:#F1F5F8;--line:#D6DFE8;--sheet:#FFFFFF;--green:#17915B;--greenfill:#2FBF71;--amber:#A86F06;--amberfill:#E7B24B;--cream:#FBF1DD;--chip:#0E2A47;--chiptext:#FFFFFF;--onamber:#0E2A47;--tile:#0E2A47;--tiletext:#F4F7FA;--prompt:#7FD8A6;--check:#FFFFFF;--tint:#E9F6EE}
    text{fill:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif;font-size:16px}
    .m{fill:var(--muted)} .c{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .b{font-weight:600} .pre{white-space:pre}
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--ink)"/>
    </marker>
  </defs>
  <rect x="536" y="14" width="244" height="262" rx="18" fill="var(--panel)"/>
  <circle cx="66" cy="88" r="26" fill="var(--greenfill)"/>
  <polyline points="54.3,88.5 63.4,97.9 79.0,78.1" fill="none" stroke="var(--check)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="152" class="b" style="font-size:21px">Passed</text>
  <text x="40" y="182">It ran and found nothing</text>
  <rect x="40" y="226" width="144" height="28" rx="14" fill="none" stroke="var(--line)" stroke-width="1.4"/>
  <text x="49" y="245" class="c m" style="font-size:14px">print_cat_usage</text>
  <circle cx="326" cy="88" r="26" fill="var(--amberfill)"/>
  <path d="M317,79 L335,97 M335,79 L317,97" stroke="var(--onamber)" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="152" class="b" style="font-size:21px">Failed</text>
  <text x="300" y="182">It ran and found</text>
  <text x="300" y="205">something to fix</text>
  <rect x="300" y="226" width="85" height="28" rx="14" fill="none" stroke="var(--line)" stroke-width="1.4"/>
  <text x="309" y="245" class="c m" style="font-size:14px">tf_usage</text>
  <circle cx="586" cy="88" r="25" fill="none" stroke="var(--muted)" stroke-width="2.6" stroke-dasharray="6 5.2"/>
  <line x1="578" y1="88" x2="594" y2="88" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
  <text x="560" y="152" class="b" style="font-size:21px">Skipped</text>
  <text x="560" y="182">It could not run</text>
  <text x="560" y="205">and never counts as a pass</text>
  <rect x="560" y="226" width="119" height="28" rx="14" fill="none" stroke="var(--line)" stroke-width="1.4"/>
  <text x="569" y="245" class="c m" style="font-size:14px">url_liveness</text>
</svg>

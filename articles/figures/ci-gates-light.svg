<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 20 546 224" width="546" height="224"
     role="img" aria-labelledby="ci-t">
  <title id="ci-t">The same check, at three latencies</title>

  <!-- The point the YAML cannot make on its own: it is the same call each time,
       and the only thing that changes is how long you wait to hear about it. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <path d="M24 57 V211" stroke="#0E2A47" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
    <g fill="#1FA45C">
      <circle cx="24" cy="57"  r="4"/>
      <circle cx="24" cy="136" r="4"/>
    </g>
    <circle cx="24" cy="211" r="4" fill="#D97A34"/>

    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
       font-size="10" letter-spacing="1.3" font-weight="700" fill="#0E2A47">
      <text x="40" y="53">YOUR LAPTOP</text>
      <text x="40" y="132">THE PULL REQUEST</text>
      <text x="40" y="207">CRAN</text>
    </g>
    <g font-size="9" fill="#0E2A47" fill-opacity="0.5">
      <text x="40" y="69">.git/hooks/pre-commit</text>
      <text x="40" y="148">GitHub Actions</text>
      <text x="40" y="223">a reviewer, by hand</text>
    </g>

    <g fill="#0E2A47" fill-opacity="0.04" stroke="#0E2A47" stroke-opacity="0.14">
      <rect x="196" y="28"  width="356" height="58" rx="7"/>
      <rect x="196" y="100" width="356" height="72" rx="7"/>
    </g>
    <rect x="196" y="186" width="356" height="50" rx="7"
          fill="#D97A34" fill-opacity="0.06" stroke="#D97A34" stroke-opacity="0.4"/>

    <!-- the same call, highlighted in both gates -->
    <rect x="303" y="58" width="110" height="15" rx="3" fill="#1FA45C" fill-opacity="0.16"/>
    <rect x="274" y="128" width="110" height="15" rx="3" fill="#1FA45C" fill-opacity="0.16"/>

    <text x="208" y="50" font-size="9" fill="#0E2A47" fill-opacity="0.5">#!/usr/bin/env bash</text>
    <text x="208" y="70" font-size="9.5" fill="#0E2A47">Rscript -e 'if (!checktor::checkup()) quit(status = 1)'</text>

    <text x="208" y="122" font-size="9" fill="#0E2A47" fill-opacity="0.5">- name: Run extra-CRAN checks</text>
    <text x="208" y="140" font-size="9.5" fill="#0E2A47">&#160;&#160;run: if (!checktor::checkup()) quit(status = 1)</text>
    <text x="208" y="158" font-size="9" fill="#0E2A47" fill-opacity="0.5">&#160;&#160;shell: Rscript {0}</text>

    <text x="208" y="216" font-size="10" fill="#0E2A47" fill-opacity="0.75">the same finding, weeks later</text>

    <!-- what it costs to hear about it here -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
       font-size="7.5" letter-spacing="0.8" font-weight="700" fill="#FFFFFF">
      <rect x="486" y="38"  width="60" height="16" rx="3" fill="#157F49"/>
      <text x="494" y="49">SECONDS</text>
      <rect x="486" y="110" width="60" height="16" rx="3" fill="#157F49"/>
      <text x="494" y="121">MINUTES</text>
      <rect x="498" y="196" width="48" height="16" rx="3" fill="#B4541F"/>
      <text x="506" y="207">WEEKS</text>
    </g>
  </g>
</svg>

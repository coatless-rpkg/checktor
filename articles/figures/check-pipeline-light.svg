<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 20 500 336" width="500" height="336"
     role="img" aria-labelledby="pipe-t">
  <title id="pipe-t">From R source to a finding</title>

  <!-- One artifact per stage. The prose does the explaining, so nothing here
       comments on the data it is sitting next to. Each panel's content is
       centred in it, and the accent rule is clipped to the panel so it follows
       the rounded corner instead of overshooting it. -->
  <defs>
    <clipPath id="cp-result">
      <rect x="176" y="298" width="330" height="50" rx="7"/>
    </clipPath>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- the rail, pinned to the centre of the first and last stage -->
    <path d="M24 77 V323" stroke="#0E2A47" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
    <g fill="#1FA45C">
      <circle cx="24" cy="77"  r="4"/>
      <circle cx="24" cy="178" r="4"/>
      <circle cx="24" cy="259" r="4"/>
      <circle cx="24" cy="323" r="4"/>
    </g>

    <!-- stage, then the API that performs it, centred against its panel -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
       font-size="10" letter-spacing="1.3" font-weight="700" fill="#0E2A47">
      <text x="40" y="73">SOURCE</text>
      <text x="40" y="174">PARSE</text>
      <text x="40" y="255">QUERY</text>
      <text x="40" y="319">RESULT</text>
    </g>
    <g font-size="9.5" fill="#0E2A47" fill-opacity="0.5">
      <text x="40" y="89">R/foo.R</text>
      <text x="40" y="190">read_r_xml()</text>
      <text x="40" y="271">xpath_lints()</text>
      <text x="40" y="335">checktor_check_result</text>
    </g>

    <!-- panels -->
    <g fill="#0E2A47" fill-opacity="0.04" stroke="#0E2A47" stroke-opacity="0.14">
      <rect x="176" y="28"  width="330" height="98" rx="7"/>
      <rect x="176" y="136" width="330" height="84" rx="7"/>
      <rect x="176" y="230" width="330" height="58" rx="7"/>
      <rect x="176" y="298" width="330" height="50" rx="7"/>
    </g>
    <rect x="176" y="298" width="4" height="50" fill="#1FA45C" clip-path="url(#cp-result)"/>

    <!-- SOURCE: the line gutter makes foo.R:42 traceable -->
    <rect x="212" y="56" width="160" height="20" rx="3" fill="#1FA45C" fill-opacity="0.15"/>
    <g font-size="10" fill="#0E2A47" fill-opacity="0.4" text-anchor="end">
      <text x="206" y="50">41</text>
      <text x="206" y="70">42</text>
      <text x="206" y="90">43</text>
      <text x="206" y="110">44</text>
    </g>
    <g font-size="12" fill="#0E2A47">
      <text x="216" y="50">set_precision &lt;- function(x) {</text>
      <text x="216" y="70">&#160;&#160;options(digits = 3)</text>
      <text x="216" y="90" fill-opacity="0.5">&#160;&#160;round(x, 3)</text>
      <text x="216" y="110" fill-opacity="0.5">}</text>
    </g>

    <!-- PARSE -->
    <g stroke="#0E2A47" stroke-opacity="0.25" fill="none">
      <path d="M200 161 V175 H208"/>
      <path d="M214 183 V197 H222"/>
    </g>
    <text x="196" y="157" font-size="11" fill="#0E2A47" fill-opacity="0.6">&lt;expr&gt;</text>
    <text x="210" y="179" font-size="11" fill="#0E2A47" fill-opacity="0.6">&lt;expr&gt;</text>
    <rect x="220" y="187" width="190" height="19" rx="3" fill="#1FA45C" fill-opacity="0.15"/>
    <text x="224" y="201" font-size="11" fill="#0E2A47">SYMBOL_FUNCTION_CALL options</text>

    <!-- QUERY -->
    <text x="192" y="251" font-size="11" fill="#0E2A47">//SYMBOL_FUNCTION_CALL[text() = 'options']</text>
    <text x="192" y="271" font-size="11" fill="#0E2A47" fill-opacity="0.6">&#160;&#160;[ not_under_fn_with_call_xpath("on.exit") ]</text>

    <!-- RESULT -->
    <rect x="190" y="311" width="88" height="24" rx="3" fill="#1FA45C" fill-opacity="0.15"/>
    <text x="196" y="328" font-size="14" fill="#0E2A47">foo.R:42</text>
    <text x="292" y="328" font-size="11" fill="#0E2A47" fill-opacity="0.6">passed = FALSE</text>
  </g>
</svg>

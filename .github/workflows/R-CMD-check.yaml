# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Force install the package itself (local::.) so Windows resolves
          # it correctly during the check step
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Dogfood: run checktor on its own sources so a regression that the tool
      # would flag fails the build on every platform. Findings are annotated onto
      # the diff and written to a report, then the gate decides the build.
      - name: checktor on itself
        shell: Rscript {0}
        run: |
          results <- checktor::checktor(".", verbose = FALSE, progress = FALSE)

          # Puts each finding on the line that caused it, in the pull request.
          checktor::ci_report(results, format = "github", file = NULL)

          # The same findings as a report to keep, whatever the outcome.
          checktor::health_report(results, file = "checktor-report.md")

          if (!checktor::is_healthy(results)) {
            stop("checktor reported issues in its own sources")
          }

      # Kept whether or not the gate passed, so a failure is readable after the
      # log has scrolled away.
      - name: Upload checktor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checktor-report-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: checktor-report.md
          if-no-files-found: ignore

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" width="800" height="296" role="img" aria-label="On the left, a console runs ci_report(). Below it, the build systems it writes for: GitHub Actions, GitLab, Azure Pipelines, Jenkins and GitHub code scanning. On the right, lines 6 to 9 of R/tf_usage_bad.R as a pull request shows them. Under line 8, return(F), an amber note reads checktor: tf_usage, T/F usage check: tf_usage_bad.R:8.">
  <style>
    svg{--ink:#DEE2E6;--muted:#ADB5BD;--panel:#2B3035;--line:#3A4148;--sheet:#1B1F23;--green:#35C07F;--greenfill:#2FBF71;--amber:#E6B34D;--amberfill:#E7B24B;--cream:#3A3320;--chip:#DEE2E6;--chiptext:#1B1F23;--onamber:#0E2A47;--tile:#343A40;--tiletext:#F8F9FA;--prompt:#7FD8A6;--check:#1B1F23;--tint:#1F3A2B}
    text{fill:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif;font-size:16px}
    .m{fill:var(--muted)} .c{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .b{font-weight:600} .pre{white-space:pre}
  </style>

url: https://r-pkg.thecoatlessprofessor.com/checktor

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # checktor brand green (the checkmark outline in the logo). It drives
    # buttons, active states, and badges. Links use an AA-legible shade set in
    # pkgdown/extra.scss so body-text links clear WCAG contrast.
    primary: "#1FA45C"
  opengraph:
    twitter:
      creator: "@axiomsofxyz"
      card: summary_large_image

home:
  links:
  - text: CRAN Repository Policy
    href: https://cran.r-project.org/web/packages/policies.html
  - text: Releasing a package (R Packages, 2e)
    href: https://r-pkgs.org/release.html
  - text: lintr
    href: https://lintr.r-lib.org
  - text: rcmdcheck
    href: https://rcmdcheck.r-lib.org

navbar:
  structure:
    # `lightswitch` must be listed explicitly. Setting `light-switch: true`
    # alone only enables the feature; pkgdown drops the toggle whenever
    # `structure.right` is overridden, as it is here.
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started-with-checktor.html
      - text: checktor in Continuous Integration
        href: articles/checktor-in-ci.html
      - text: Writing Your Own Checks
        href: articles/writing-checks.html

reference:
- title: Overview
  desc: >
    Start here. The package-level help topic summarises what checktor checks
    and how the pieces fit together.
  contents:
  - checktor-package

- title: Top-level orchestrator
  desc: >
    Functions you call directly to diagnose a package.
  contents:
  - checktor
  - checkup
  - prescribe
  - health_report
  - configure_doctor

- title: Code-pattern diagnostics
  desc: >
    Per-check entry points for R source patterns. Each operates on the parsed
    AST and can be called independently of `checktor()`.
  contents:
  - diagnose_code_issues
  - diagnose_tf_usage
  - diagnose_seed_setting
  - diagnose_print_cat_usage
  - diagnose_detect_cores_robustness
  - diagnose_option_changes
  - diagnose_home_writing
  - diagnose_temp_cleanup
  - diagnose_globalenv_modification
  - diagnose_installed_packages_usage
  - diagnose_warn_option
  - diagnose_software_installation
  - diagnose_core_usage
  - diagnose_library_in_pkg_code
  - diagnose_sys_setenv_no_reset
  - diagnose_hardcoded_credentials

- title: DESCRIPTION-field diagnostics
  desc: >
    Checks against the DESCRIPTION file, parsed via `base::read.dcf()`.
  contents:
  - diagnose_description_issues
  - diagnose_software_names_formatting
  - diagnose_acronym_explanation
  - diagnose_license_formatting
  - diagnose_license_year
  - diagnose_title_case
  - diagnose_title_length
  - diagnose_title_starts_with_article
  - diagnose_title_redundant_phrases
  - diagnose_description_function_quotes
  - diagnose_authors_field
  - diagnose_identifier_format
  - diagnose_cph_role
  - diagnose_references_formatting
  - diagnose_date_format
  - diagnose_encoding_utf8
  - diagnose_version_format
  - diagnose_description_length
  - diagnose_description_starts_with
  - diagnose_description_quoted_quotes
  - diagnose_description_bare_r

- title: Documentation diagnostics
  desc: >
    Checks against `.Rd` files, walked via `tools::parse_Rd()`.
  contents:
  - diagnose_documentation_issues
  - diagnose_value_tags
  - diagnose_missing_examples
  - diagnose_roxygen_usage
  - diagnose_example_structure
  - diagnose_unexported_example_namespace
  - diagnose_commented_examples
  - diagnose_donttest_vs_dontrun
  - diagnose_suggested_in_examples

- title: General-purpose diagnostics
  desc: >
    Package-level checks (size, URLs, NEWS, README links) that don't fit
    other categories.
  contents:
  - diagnose_general_issues
  - diagnose_package_size
  - diagnose_urls
  - diagnose_news_file
  - diagnose_readme_relative_links
  - diagnose_cran_comments_file

- title: CRAN policy diagnostics
  desc: >
    Checks targeting common CRAN policy violations (debugging leftovers,
    raw shell calls, file/network access).
  contents:
  - diagnose_policy_violations
  - diagnose_browser_calls
  - diagnose_system_calls
  - diagnose_file_operations
  - diagnose_network_operations

- title: Result classes
  desc: >
    S3 constructors and print methods for diagnostic result objects.
    You typically don't construct these by hand - use the diagnostic
    functions instead.
  contents:
  - checktor_check_result
  - checktor_category_result
  - print.checktor_check_result
  - print.checktor_category_result
  - print.checktor_results

- title: Result accessors
  desc: >
    Plain accessors over diagnostic results so you never navigate nested
    sublists. Work on a full `checktor()` result, a single category, or a
    single check.
  contents:
  - issues
  - tidy.checktor_results
  - summary.checktor_results
  - predicates
  - reexports

- title: Example scenarios
  desc: >
    Helpers for building temporary packages with canned bad-pattern code,
    used in the `@examples` of individual diagnostics.
  contents:
  - example_diagnose_scenario
  - show_example_files

- title: Extending checktor
  desc: >
    Register a custom check with `checktor()`, plus the AST toolkit the built-in
    checks use to inspect parsed sources and `.Rd` files.
  contents:
  - register_check
  - unregister_check
  - registered_checks
  - read_r_xml
  - xpath_lints
  - xpath_per_file
  - undesirable_function_check
  - not_under_fn_with_call_xpath
  - extract_rd_section
  - collect_rd_text

development:
  mode: auto

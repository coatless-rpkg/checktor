url: https://r-pkg.thecoatlessprofessor.com/checktor

template:
  bootstrap: 5
  light-switch: true
  bslib:
    # checktor brand green (the checkmark outline in the logo). It drives
    # buttons, active states, and badges. Links use an AA-legible shade set in
    # pkgdown/extra.scss so body-text links clear WCAG contrast.
    primary: "#1FA45C"
  opengraph:
    twitter:
      creator: "@axiomsofxyz"
      card: summary_large_image

home:
  links:
  - text: CRAN Repository Policy
    href: https://cran.r-project.org/web/packages/policies.html
  - text: Releasing a package (R Packages, 2e)
    href: https://r-pkgs.org/release.html
  - text: lintr
    href: https://lintr.r-lib.org
  - text: rcmdcheck
    href: https://rcmdcheck.r-lib.org

navbar:
  structure:
    # `lightswitch` must be listed explicitly. Setting `light-switch: true`
    # alone only enables the feature; pkgdown drops the toggle whenever
    # `structure.right` is overridden, as it is here.
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started-with-checktor.html
      - text: Where the Checks Come From
        href: articles/check-sources.html
      - text: What R CMD check Checks
        href: articles/r-cmd-check.html
      - text: checktor in Continuous Integration
        href: articles/checktor-in-ci.html
      - text: Writing Your Own Checks
        href: articles/writing-checks.html

reference:
- title: Overview
  desc: >
    Start here. The package-level help topic summarises what checktor checks
    and how the pieces fit together.
  contents:
  - checktor-package

- title: Top-level orchestrator
  desc: >
    Functions you call directly to diagnose a package.
  contents:
  - checktor
  - checkup
  - prescribe
  - health_report
  - ci_report
  - configure_doctor

- title: Category diagnostics
  desc: >
    One per category. Each runs the panel of `lab_*()` checks below it and
    returns them together, which is what `checktor()` calls.
  contents:
  - diagnose_code_issues
  - diagnose_description_issues
  - diagnose_documentation_issues
  - diagnose_general_issues
  - diagnose_policy_violations

- title: Code checks
  desc: >
    Individual checks on R source, run against the parsed syntax tree. The name
    after `lab_` is the check name that `tidy()` reports.
  contents:
  - lab_tf_usage
  - lab_seed_setting
  - lab_print_cat_usage
  - lab_detect_cores_robustness
  - lab_option_changes
  - lab_home_writing
  - lab_temp_cleanup
  - lab_globalenv_mod
  - lab_installed_packages
  - lab_warn_option
  - lab_software_install
  - lab_core_usage
  - lab_library_in_pkg
  - lab_sys_setenv
  - lab_hardcoded_credentials
  - lab_internal_ns

- title: DESCRIPTION checks
  desc: >
    Individual checks on the DESCRIPTION file, parsed via `base::read.dcf()`.
  contents:
  - lab_software_names
  - lab_language_names
  - lab_acronyms
  - lab_license
  - lab_license_year
  - lab_title_case
  - lab_title_length
  - lab_title_starts_with_article
  - lab_title_redundant_phrases
  - lab_description_function_quotes
  - lab_authors
  - lab_identifier_format
  - lab_cph_role
  - lab_references
  - lab_date_format
  - lab_encoding_utf8
  - lab_version_format
  - lab_spelling
  - lab_description_length
  - lab_description_starts_with
  - lab_description_quoted_quotes

- title: Documentation checks
  desc: >
    Individual checks on `.Rd` files, walked via `tools::parse_Rd()`.
  contents:
  - lab_value_tags
  - lab_missing_examples
  - lab_roxygen_usage
  - lab_example_structure
  - lab_unexported_example_ns
  - lab_commented_examples
  - lab_donttest_vs_dontrun
  - lab_suggested_in_examples

- title: Example, vignette and demo checks
  desc: >
    Individual checks on the code CRAN reads outside `R/`: the examples in `.Rd`
    files, vignette chunks, and demos.
  contents:
  - lab_example_interactive
  - lab_example_installs
  - lab_example_writes
  - lab_example_state
  - lab_example_internal_ns

- title: General checks
  desc: >
    Package-level checks covering size, URLs, NEWS and README links.
  contents:
  - lab_package_size
  - lab_urls
  - lab_url_liveness
  - lab_news_file
  - lab_readme_links
  - lab_cran_comments_file

- title: CRAN policy checks
  desc: >
    Individual checks for common CRAN policy violations, covering debugging
    leftovers, raw shell calls, and file and network access.
  contents:
  - lab_browser_calls
  - lab_system_calls
  - lab_file_operations
  - lab_network_operations

- title: Result classes
  desc: >
    S3 constructors and print methods for diagnostic result objects.
    You typically don't construct these by hand - use the diagnostic
    functions instead.
  contents:
  - checktor_check_result
  - checktor_category_result
  - print.checktor_check_result
  - print.checktor_category_result
  - print.checktor_results

- title: Result accessors
  desc: >
    Plain accessors over diagnostic results so you never navigate nested
    sublists. Work on a full `checktor()` result, a single category, or a
    single check.
  contents:
  - issues
  - tidy.checktor_results
  - summary.checktor_results
  - predicates
  - reexports

- title: Example scenarios
  desc: >
    Helpers for building temporary packages with canned bad-pattern code,
    used in the `@examples` of individual diagnostics.
  contents:
  - example_diagnose_scenario
  - show_example_files

- title: Extending checktor
  desc: >
    Register a custom check with `checktor()`, plus the AST toolkit the built-in
    checks use to inspect parsed sources and `.Rd` files.
  contents:
  - register_check
  - unregister_check
  - registered_checks
  - find_package_root
  - read_r_xml
  - xpath_lints
  - xpath_per_file
  - undesirable_function_check
  - not_under_fn_with_call_xpath
  - extract_rd_section
  - collect_rd_text

development:
  mode: auto

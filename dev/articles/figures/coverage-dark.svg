<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 600 244" width="600" height="244"
     role="img" aria-labelledby="cov-t">
  <title id="cov-t">What each tool actually catches</title>

  <!-- Every cell below was verified by running R CMD check (as-cran), lintr
       (all_linters), and checktor against one identical demo package. The
       line-length row is included precisely because checktor loses it. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- column heads -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
       font-size="8" letter-spacing="0.9" font-weight="700" text-anchor="middle">
      <text x="372" y="24" fill="#E7EEF5" fill-opacity="0.55">R CMD CHECK</text>
      <text x="452" y="24" fill="#E7EEF5" fill-opacity="0.55">LINTR</text>
      <text x="532" y="24" fill="#1FA45C">CHECKTOR</text>
    </g>
    <path d="M6 34 H596" stroke="#E7EEF5" stroke-opacity="0.12"/>

    <!-- the gap: the last three rows, which only checktor fills -->
    <rect x="2" y="146" width="594" height="78" rx="6" fill="#1FA45C" fill-opacity="0.07"/>

    <!-- row labels -->
    <g font-size="10" fill="#E7EEF5">
      <text x="6" y="56">Undocumented arguments</text>
      <text x="6" y="82">A line over 80 characters</text>
      <text x="6" y="108">A bare T instead of TRUE</text>
      <text x="6" y="134">A Title not in title case</text>
      <text x="6" y="166">set.seed() left in a function</text>
      <text x="6" y="192">A Description of one line</text>
      <text x="6" y="218">A missing \value{} tag</text>
    </g>

    <!-- misses -->
    <g fill="none" stroke="#E7EEF5" stroke-opacity="0.2" stroke-width="1.2">
      <circle cx="452" cy="52"  r="4.5"/><circle cx="532" cy="52"  r="4.5"/>
      <circle cx="372" cy="78"  r="4.5"/><circle cx="532" cy="78"  r="4.5"/>
      <circle cx="372" cy="104" r="4.5"/>
      <circle cx="452" cy="130" r="4.5"/>
      <circle cx="372" cy="162" r="4.5"/><circle cx="452" cy="162" r="4.5"/>
      <circle cx="372" cy="188" r="4.5"/><circle cx="452" cy="188" r="4.5"/>
      <circle cx="372" cy="214" r="4.5"/><circle cx="452" cy="214" r="4.5"/>
    </g>

    <!-- caught by R CMD check / lintr -->
    <g fill="#E7EEF5" fill-opacity="0.5">
      <circle cx="372" cy="52"  r="4.5"/>
      <circle cx="452" cy="78"  r="4.5"/>
      <circle cx="452" cy="104" r="4.5"/>
      <circle cx="372" cy="130" r="4.5"/>
    </g>

    <!-- caught by checktor -->
    <g fill="#1FA45C">
      <circle cx="532" cy="104" r="4.5"/>
      <circle cx="532" cy="130" r="4.5"/>
      <circle cx="532" cy="162" r="4.5"/>
      <circle cx="532" cy="188" r="4.5"/>
      <circle cx="532" cy="214" r="4.5"/>
    </g>

    <text x="6" y="244" font-size="9" fill="#E7EEF5" fill-opacity="0.5"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">The shaded rows are the gap. Note the second row, where lintr catches what checktor does not.</text>
  </g>
</svg>
